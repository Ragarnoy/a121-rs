[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32L431CBYx"

[target.thumbv7em-none-eabihf]
linker = "arm-none-eabi-gcc"
rustflags = [
    "-C", "link-arg=-Tlink.x",
#    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=-mcpu=cortex-m4",
    "-C", "link-arg=-mthumb",
    "-C", "link-arg=-mfloat-abi=hard",
    "-C", "link-arg=-mfpu=fpv4-sp-d16",
    "-L", "/usr/lib/arm-none-eabi/newlib/thumb/v7e-m+fp/hard",
    "-C", "link-arg=-lm",
    "-C", "link-arg=-lc",
    # Link newlib's sinf/cosf/tanf ahead of compiler_builtins. The compiler_builtins versions pull in
    # __rem_pio2_large and soft-float double arithmetic (~10 KB), which the SDK does not otherwise need.
    "-Z", "pre-link-args=-Wl,-u,sinf -Wl,-u,cosf -Wl,-u,tanf -L/usr/lib/arm-none-eabi/newlib/thumb/v7e-m+fp/hard -lm",
]

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
ACC_RSS_LIBS={ value = "/usr/lib/acconeer", relative = false }
CPATH="/usr/lib/arm-none-eabi/include:/usr/arm-none-eabi/include"
