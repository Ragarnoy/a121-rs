[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 --log-format defmt"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
# Directory holding the Acconeer A121 static libraries for the ESP32-S3, see acc/README.md
ACC_RSS_LIBS = { value = "acc", relative = true }

[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
# Xtensa targets ship no prebuilt core/alloc
build-std = ["alloc", "core"]
