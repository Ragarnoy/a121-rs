[package]
name = "esp32s3-hal-rss-demo"
version = "0.1.0"
authors = ["Noah"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3", "defmt", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "defmt"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "defmt"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3", "defmt"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "defmt"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "defmt-espflash"] }
defmt = "1.0.1"
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
static_cell = "2.1.1"
a121-rs = { path = "../../", features = ["distance", "logger", "libm"] }

[profile.release]
debug = true
