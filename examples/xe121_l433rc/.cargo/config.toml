[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32L433RCTxP --connect-under-reset"

[target.thumbv7em-none-eabihf]
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
# Directory holding the Acconeer A121 SDK libraries for Cortex-M4 (libacconeer_a121.a and the
# detector libraries). Override it from the environment.
ACC_RSS_LIBS = { value = "/usr/lib/acconeer", relative = false }
