[package]
name = "xe121_l433rc-hal"
version = "0.1.0"
edition = "2021"

[dependencies]
# `logger` and `libm` provide what the SDK would otherwise take from newlib, so no C library is linked
a121-rs = { path = "../..", features = ["distance", "defmt", "logger", "libm", "heap-stats"] }

panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "1.1"
defmt-rtt = "1.2"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32l433rc", "memory-x", "time-driver-any", "exti"] }
embedded-hal-bus = { version = "0.3.0", features = ["defmt-03"] }

talc = "5.1"
spin = "0.12"
static_cell = "2.1"

[profile.dev]
lto = true
codegen-units = 1

[profile.release]
debug = 2
codegen-units = 1
lto = true
opt-level = "s"
