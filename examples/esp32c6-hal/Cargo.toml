[package]
name = "esp32c6-hal"
version = "0.1.0"
authors = ["Leon <12817042+thedevleon@users.noreply.github.com>"]
edition = "2021"
license = "MIT"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32c6", "defmt", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32c6", "embassy", "defmt"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "defmt"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6", "defmt"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c6", "panic-handler", "defmt"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "defmt-espflash"] }
defmt = "1.0.1"
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
static_cell = "2.1.1"
a121-rs = { path = "../../", features = ["distance", "logger", "libm"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
