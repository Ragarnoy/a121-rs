[package]
name = "a121-rs"
description = "Rust driver for the Acconeer A121 radar sensor"
authors = ["Ragarnoy <tiagolernould@gmail.com>"]
keywords = ["embedded", "a121", "radar"]
repository = "https://github.com/Ragarnoy/a121-rs"
documentation = "https://docs.rs/a121-rs"
categories = ["embedded", "no-std"]
readme = "README.md"
license = "MIT"
edition = "2021"
version = "0.3.0"
rust-version = "1.99"

[dependencies]
a121-sys = "0.8.0"

defmt = { version = "1.0.1", optional = true }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.8.0"

num = { version = "0.4", default-features = false }
libm = { version = "0.2.15", default-features = false, optional = true }

[dev-dependencies]
# Host tests lock the HAL's critical-section mutexes
critical-section = { version = "1.1", features = ["std"] }

[features]
distance = ["a121-sys/distance"]
presence = ["a121-sys/presence"]
libm = ["dep:libm", "num/libm"]
# Log SDK messages through a Rust variadic function instead of the C logging bridge.
# Recommended if you don't want to have to link a huge chunk of newlib. Needs a defmt global logger.
# SDK messages are formatted in Rust, so the C logging bridge and newlib's vsnprintf are not linked.
logger = ["defmt"]
# Deprecated alias for `logger`, kept for compatibility. Variadic functions are stable since Rust 1.99.
nightly-logger = ["logger"]
std = ["a121-sys/std"]
defmt = ["dep:defmt", "embassy-sync/defmt"]
# Count the memory the SDK allocates, see `memory::sdk_heap_stats`
heap-stats = []
# Link against generated stub libraries instead of the Acconeer SDK (host builds and tests)
stub_library = ["a121-sys/stub_library"]

[package.metadata.docs.rs]
# docs.rs has no Acconeer libraries, so build against the a121-sys stubs
features = ["stub_library", "distance", "presence", "libm", "defmt", "heap-stats"]
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev]
lto = true
codegen-units = 1

[profile.release]
debug = 2
codegen-units = 1
lto = true
opt-level = "s"
